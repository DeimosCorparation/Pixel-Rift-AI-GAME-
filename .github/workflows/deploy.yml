name: Build and Release Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Release APK
        run: ./gradlew assembleRelease || ./gradlew assembleDebug
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Artifacts (Debug)
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release and Upload APK Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'v1.1.1'
          name: 'Pixel Rift v1.1.1 (Latest)'
          body: |
            ✦ Автоматический релиз Pixel Rift v1.1.1!
            • Свежий билд APK успешно собран и прикреплен к этому релизу.
            • Игра автоматически проверяет этот релиз при запуске и предлагает обновление.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          overwrite: true
